<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交我录 · 检验报告录入前质控</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">交</div>
    <div class="brand-text">
      <h1>交我录</h1>
      <p>检验报告录入前质控</p>
    </div>
  </div>
  <div class="top-right">
    <span id="model-pill" class="pill pill-idle">模型未配置</span>
    <button id="btn-settings" class="btn ghost">设置</button>
  </div>
</header>

<div class="batch-toolbar" role="group" aria-label="批次规则与导出">
  <button id="btn-rules" class="btn rule-button" type="button" aria-haspopup="dialog">
    <span class="toolbar-label">本批规则</span>
    <strong id="rule-label">常规页面组</strong>
    <span id="rule-summary" class="toolbar-detail"></span>
    <span aria-hidden="true">⌄</span>
  </button>
  <div class="export-actions" role="group" aria-label="导出结果">
    <span id="export-scope" class="toolbar-detail" aria-live="polite"></span>
    <button id="btn-export" class="btn" type="button">导出 CSV</button>
    <button id="btn-export-json" class="btn" type="button">导出 JSON</button>
    <details class="export-options">
      <summary aria-label="导出选项" title="导出选项">⋯</summary>
      <label><input type="checkbox" id="chk-hide-ident" checked> 导出时隐藏身份信息</label>
    </details>
  </div>
</div>

<main id="workbench" class="layout">
  <aside class="side" aria-labelledby="queue-title">
    <div class="queue-head">
      <h2 id="queue-title">本批患者</h2>
      <span id="queue-count" class="toolbar-detail"></span>
    </div>
    <button id="btn-all-patients" type="button" class="queue-all" aria-pressed="false">全部患者</button>
    <div id="patient-list" class="patient-list"></div>
    <div class="queue-actions">
      <button id="btn-add-patient" class="btn ghost wide" type="button">+ 添加患者</button>
      <button id="btn-reset" class="link danger" type="button">清空本次任务</button>
    </div>
  </aside>

  <section id="work" class="work" aria-labelledby="patient-title">
    <div class="work-head">
      <div>
        <h2 id="patient-title">全部患者</h2>
        <p id="patient-sub" class="muted"></p>
      </div>
      <div id="work-actions" class="work-actions" hidden>
        <button id="btn-upload" class="btn" type="button">上传报告</button>
        <input id="file-input" type="file" multiple accept="image/*,application/pdf" hidden>
        <button id="btn-run" class="btn primary" type="button" hidden>开始识别</button>
      </div>
    </div>

    <div id="batch-overview" hidden></div>
    <div id="patient-work" hidden>
      <div id="dropzone" class="dropzone">
        <div class="upload-icon" aria-hidden="true">↑</div>
        <input id="drop-input" type="file" multiple accept="image/*,application/pdf" hidden>
        <p class="dz-title">导入这位患者的报告</p>
        <p class="dz-sub">拖放文件到这里，支持图片和 PDF</p>
        <button id="dz-pick" class="btn primary" type="button">选择文件</button>
      </div>

      <p id="recognition-status" class="work-status" role="status" hidden></p>
      <details id="report-list" class="report-list" hidden>
        <summary id="report-summary">报告</summary>
        <div id="asset-strip" class="asset-strip"></div>
      </details>
      <p id="recognition-note" class="work-note" hidden>开始识别会将这位患者的报告页发送到已配置的模型服务。</p>

      <section id="results" class="results" aria-label="识别结果" hidden>
        <div class="results-head">
          <div class="result-switch" role="group" aria-label="结果范围">
            <button id="btn-review" type="button" aria-pressed="true">待核对</button>
            <button id="btn-results-all" type="button" aria-pressed="false">全部结果</button>
          </div>
          <div id="stats" class="stats" aria-label="待核对概览"></div>
        </div>
        <div id="date-bar" class="date-bar" hidden></div>
  <div id="rerun-hint" class="rerun-hint" hidden></div>
        <div id="action-queue" class="action-queue" aria-label="需要处理的事项" hidden></div>
        <div id="results-empty" class="stage-empty" role="status" hidden></div>
        <div id="results-table" class="table-wrap">
          <table class="grid">
            <thead>
              <tr>
                <th class="col-name" scope="col">指标</th>
                <th class="col-value" scope="col">结果</th>
                <th class="col-unit" scope="col">单位</th>
                <th class="col-ref" scope="col">参考范围</th>
                <th class="col-src" scope="col">状态与来源</th>
              </tr>
            </thead>
            <tbody id="grid-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </section>
  <aside id="inspector" class="inspector" aria-label="核对详情" hidden></aside>
</main>

<dialog id="rules-dialog" class="workbench-dialog" aria-labelledby="rules-title">
  <div class="dialog-heading">
    <h2 id="rules-title">本批质控规则</h2>
    <button type="button" class="btn" data-close-dialog aria-label="关闭规则">×</button>
  </div>
  <p class="muted">规则应用于本批所有患者。已识别报告可在报告详情中重新识别。</p>
  <button id="btn-task-ai" class="btn primary wide" type="button">一句话生成质控任务</button>
  <p class="muted">AI 只提出页面与必填配置，预览确认后才应用。</p>
  <div class="rule-picker">
    <label for="rule-preset">套用页面组</label>
    <select id="rule-preset" class="select"></select>
    <button id="btn-apply-rule" class="btn" type="button" disabled>套用</button>
  </div>
  <div id="page-checks" class="page-checks"></div>
  <div class="dialog-actions">
    <button id="btn-library" class="link" type="button">管理指标与页面</button>
    <button type="button" class="btn primary" data-close-dialog>完成</button>
  </div>
</dialog>

<dialog id="task-dialog" class="workbench-dialog task-dialog" aria-labelledby="task-title">
  <div class="dialog-heading">
    <h2 id="task-title">一句话生成质控任务</h2>
    <button type="button" class="btn" data-close-task aria-label="关闭">×</button>
  </div>
  <label for="task-requirement">本次要整理什么，哪些项目必须齐全？</label>
  <textarea id="task-requirement" rows="4" maxlength="500" placeholder="例如：本次整理病案首页、血常规和肾功能；姓名、血红蛋白、肌酐为必填，其他指标有就整理。"></textarea>
  <p class="muted">模型只能使用现有页面和指标。无法对应的要求会单独列出，不会自动创建医学规则。</p>
  <div class="dialog-actions">
    <button id="btn-task-generate" class="btn primary" type="button">生成配置预览</button>
  </div>
  <div id="task-preview" class="task-preview" aria-live="polite"></div>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close-task>取消</button>
    <button id="btn-task-apply" class="btn primary" type="button" disabled>确认并替换本批规则</button>
  </div>
</dialog>

<dialog id="export-dialog" class="workbench-dialog export-dialog" aria-labelledby="export-title" aria-describedby="export-message">
  <h2 id="export-title">仍有待核对项</h2>
  <p id="export-message"></p>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close-dialog>返回核对</button>
    <button id="btn-confirm-export" type="button" class="btn primary">仍然导出</button>
  </div>
</dialog>

<div id="modal" class="modal" hidden>
  <div id="modal-box" class="modal-box" role="dialog" aria-modal="true" aria-label="工作台设置"></div>
</div>

<div id="offline-bar" class="offline-bar" hidden>
  <span id="offline-text">本地服务已断开，上传和识别会失败</span>
  <button id="btn-reconnect" type="button">重试</button>
</div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdf-tools.js"></script>
<script src="js/indicators.js"></script>
<script src="js/model.js"></script>
<script src="js/task-assistant.js"></script>
<script src="js/app.js"></script>
</body>
</html>
